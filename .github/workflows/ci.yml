name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  analyze-test-build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify Windows plugin packaging
        shell: pwsh
        run: ./tool/windows_release_smoke.ps1 -Check Packaging
