name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.6"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content -LiteralPath "pubspec.yaml" -Raw
          $versionMatch = [regex]::Match(
            $pubspec,
            "(?m)^version:\s*(\d+\.\d+\.\d+)(?:\+\d+)?\s*$"
          )
          if (-not $versionMatch.Success) {
            throw "pubspec.yaml must declare MAJOR.MINOR.PATCH with an optional build suffix."
          }
          $projectVersion = $versionMatch.Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $buildName = "${{ github.ref_name }}".TrimStart("v")
            if ($buildName -notmatch "^\d+\.\d+\.\d+$") {
              throw "Release tags must use vMAJOR.MINOR.PATCH."
            }
            if ($buildName -ne $projectVersion) {
              throw "Release tag $buildName does not match pubspec.yaml version $projectVersion."
            }
            $label = "${{ github.ref_name }}"
          } else {
            $buildName = "0.0.${{ github.run_number }}"
            $label = "manual-${{ github.run_number }}"
          }
          "build_name=$buildName" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT

      - name: Build Windows release
        run: flutter build windows --release --build-name "${{ steps.version.outputs.build_name }}" --build-number "${{ github.run_number }}"

      - name: Verify Windows plugin packaging
        shell: pwsh
        run: ./tool/windows_release_smoke.ps1 -Check Packaging

      - name: Package Windows portable release
        shell: pwsh
        run: |
          $archive = "TAGTAG-${{ steps.version.outputs.label }}-windows-x64-portable.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $archive
          "portable=$archive" >> $env:GITHUB_OUTPUT
        id: package

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build Windows installer
        id: installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Inno Setup compiler was not installed: $iscc"
          }
          $sourceDir = (Resolve-Path "build/windows/x64/runner/Release").Path
          $outputDir = (Get-Location).Path
          $baseName = "TAGTAG-${{ steps.version.outputs.label }}-windows-x64-setup"
          & $iscc `
            "/DAppVersion=${{ steps.version.outputs.build_name }}" `
            "/DSourceDir=$sourceDir" `
            "/DOutputDir=$outputDir" `
            "/DOutputBaseFilename=$baseName" `
            "installer/tagtag.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          $setup = "$baseName.exe"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Installer output is missing: $setup"
          }
          "setup=$setup" >> $env:GITHUB_OUTPUT

      - name: Verify portable archive
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP "tagtag-portable-test"
          Expand-Archive -LiteralPath "${{ steps.package.outputs.portable }}" -DestinationPath $destination
          ./tool/windows_release_smoke.ps1 -Check Packaging -ExePath (Join-Path $destination "tagtag.exe")

      - name: Verify installer install, upgrade, and uninstall
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "tagtag-install-test"
          $setup = (Resolve-Path "${{ steps.installer.outputs.setup }}").Path
          $installArguments = @(
            "/VERYSILENT"
            "/SUPPRESSMSGBOXES"
            "/NORESTART"
            "/DIR=$installDir"
          )
          foreach ($phase in @("install", "upgrade")) {
            $process = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Installer $phase returned exit code $($process.ExitCode)"
            }
            $installedExe = Join-Path $installDir "tagtag.exe"
            ./tool/windows_release_smoke.ps1 -Check Packaging -ExePath $installedExe
          }
          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Uninstaller is missing: $uninstaller"
          }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller returned exit code $($uninstall.ExitCode)"
          }
          if (Test-Path -LiteralPath $installedExe) {
            throw "Uninstall left the installed executable behind: $installedExe"
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAGTAG-windows-x64
          path: |
            ${{ steps.package.outputs.portable }}
            ${{ steps.installer.outputs.setup }}

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.portable }}
            ${{ steps.installer.outputs.setup }}
          generate_release_notes: true
